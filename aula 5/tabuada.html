<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
</head>
<body>
    <h2>Tabuada</h2>
    <p id="for"></p>
    <form>
        <label for="numero">Digite um número de 1 a 10:</label> <br>
        <input type="number" id="num">
        <button type = "button" onclick="gerarTabuada()">Gerar Tabuada</button>
        <p id="tab"></p>  
    </form>    
</body>
<script>
    function gerarTabuada(){
        let texto = "";
        let num = document.getElementById("num").value;
        if(num < 1 || num > 10 || num == null){
            document.getElementById("tab").innerHTML = "Entrada Inválida";   
        }
        else{
        for (let i = 0; i <= 10; i++){
            texto = texto + num + " x "+i+" = "+(num*i)+"<br>";
        }
        document.getElementById("tab").innerHTML = texto;
    }
}

</script>
</html>
