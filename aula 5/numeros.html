<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laços de Repetição</title>
</head>
<body>
    <h2>Contagem de números</h2>
    <p id="for"></p>

    <form></form>
</body>
<script>

let texto = "";
for (let i = 1; i <= 200; i++){
    texto = texto + "O número "+i+"<br>";
}
document.getElementById("for").innerHTML = texto;
</script>
</html>
